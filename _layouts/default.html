<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} | science.markets</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="https://science-markets.github.io/water-liquid-liquid-critical-point/">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <style>
    .markdown-body { max-width: 680px; margin: 0 auto; font-size: 17px; line-height: 1.65; }
    .markdown-body table { display: block; overflow-x: auto; font-size: 14px; }
    .markdown-body h1 { font-size: 30px; letter-spacing: -0.01em; }
  </style>
</head>
<body>
  <div class="container-lg px-3 my-5 markdown-body">
    {{ content }}
  </div>
</body>
</html>
